[project]
name = "browserbridge"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
  "playwright==1.62.0",
  "psycopg[binary]==3.3.9",
  "pydantic==2.13.4",
  "python-multipart==0.0.33",
  "redis==8.1.0",
  "sqlalchemy==2.1.8",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "console"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires a working headless Chromium"]
